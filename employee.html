
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management | Staff Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --glass: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            width: 400px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(to right, #00d2ff, #9cedff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group { margin-bottom: 12px; }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: 0.3s;
        }

        .btn-insert { background: #22c55e; }
        .btn-update { background: #f59e0b; }
        .btn-delete { background: #ef4444; }
        .btn-view { background: #06b6d4; }
        
        .btn-project {
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            grid-column: span 2;
            margin-top: 5px;
        }

        /* --- New Table Styles --- */
        .table-container {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 200px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            color: var(--primary);
            font-size: 13px;
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        td {
            padding: 8px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:hover { background: rgba(255, 255, 255, 0.05); }

        .footer-link {
            display: block;
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>
<body>

   
    <div class="container">
        <h2>Employee Details</h2>

        <form action="employee.php" method="post">
            <div class="input-group">
                <input type="number" name="emp_id" placeholder="Employee ID" required>
            </div>
            <div class="input-group">
                <input type="text" name="name" placeholder="Full Name">
            </div>
            <div class="input-group">
                <input type="text" name="role" placeholder="Job Role">
            </div>
            <div class="input-group">
                <input type="text" name="department" placeholder="Department">
            </div>

            <div class="btn-grid">
                <button type="submit" name="insert" class="btn-insert">Insert</button>
                <button type="submit" name="update" class="btn-update">Update</button>
                <button type="submit" name="delete" class="btn-delete">Delete</button>
                <button type="submit" name="view" class="btn-view">View</button>
                
              
                <button type="button" class="btn-project" onclick="window.location.href='project.html'">
                    <i class="fas fa-folder-open" style="margin-right: 8px;"></i> Open Project Page
                </button>
            </div>
        </form>

        <a href="index.html" class="footer-link">← Return to Dashboard</a>
    </div>

</body>
</html>
